<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cammini Minimi — Simulatore di Grafi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#0b1e33;
    --bg-grid:#12304d;
    --paper:#f2e9d8;
    --paper-dim:#d8cdb4;
    --ink:#eaf2ff;
    --ink-dim:#8fa9c7;
    --line:#2c4a6e;
    --line-bright:#3f6690;
    --amber:#e8a33d;
    --teal:#4fa88a;
    --coral:#e2634f;
    --panel:#0f2438;
    --panel-edge:#1c3a58;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 4px 4px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line-bright);
    padding-bottom:14px; margin-bottom:22px; flex-wrap:wrap; gap:10px;
  }
  header.top .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.14em;
    color:var(--amber); text-transform:uppercase;
  }
  header.top h1{font-size:26px; margin:2px 0 0; font-weight:700; letter-spacing:-.01em;}
  header.top .sheet{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim);
    text-align:right; line-height:1.5;
  }

  .layout{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap;}
  .stage{flex:1 1 640px; min-width:340px;}
  .side{flex:0 0 360px; min-width:300px;}

  /* --- controls --- */
  .controls{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px;
  }
  .algo-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .algo-tab{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.03em;
    background:transparent; color:var(--ink-dim); border:1px solid var(--line);
    border-radius:6px; padding:7px 12px; cursor:pointer; transition:.15s;
  }
  .algo-tab:hover{border-color:var(--line-bright); color:var(--ink);}
  .algo-tab.active{background:var(--amber); border-color:var(--amber); color:#241503; font-weight:700;}

  .btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .btn{
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:500;
    background:var(--bg); color:var(--ink); border:1px solid var(--line-bright);
    border-radius:6px; padding:8px 14px; cursor:pointer; transition:.15s;
  }
  .btn:hover{background:var(--line-bright);}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:#062019; font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .speed{display:flex; align-items:center; gap:8px; margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim);}
  .speed input{accent-color:var(--amber);}

  /* --- svg stage --- */
  .svg-frame{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:var(--radius);
    padding:10px; position:relative; overflow:hidden;
  }
  svg{width:100%; height:auto; display:block;}
  .grid-line{stroke:var(--line); stroke-width:1; opacity:.35;}

  .edge{stroke:var(--line-bright); stroke-width:2; fill:none;}
  .edge.checking{stroke:var(--amber); stroke-width:3;}
  .edge.tree{stroke:var(--teal); stroke-width:3;}
  .edge.final{stroke:var(--coral); stroke-width:5; stroke-dasharray:9 5; animation:dash 1.1s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-28;}}

  .edge-w{
    font-family:'JetBrains Mono', monospace; font-size:11px; fill:var(--ink-dim);
  }
  .edge-w-bg{fill:var(--bg); opacity:.85;}

  .node-circle{fill:var(--paper); stroke:var(--line-bright); stroke-width:2; transition:fill .25s, stroke .25s;}
  .node-circle.current{stroke:var(--amber); stroke-width:4; animation:pulse 0.9s ease-in-out infinite;}
  .node-circle.frontier{stroke:var(--amber); stroke-width:3;}
  .node-circle.settled{fill:var(--teal); stroke:var(--teal);}
  .node-circle.final{fill:var(--coral); stroke:var(--coral);}
  @keyframes pulse{
    0%,100%{filter:drop-shadow(0 0 0px var(--amber));}
    50%{filter:drop-shadow(0 0 7px var(--amber));}
  }
  .node-label{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px;
    fill:#1a1206; text-anchor:middle; dominant-baseline:central; pointer-events:none;
  }
  .node-circle.settled ~ .node-label, .node-circle.final ~ .node-label{fill:#08120e;}

  .tag{font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; text-anchor:middle;}
  .tag.start{fill:var(--amber);}
  .tag.end{fill:var(--coral);}

  .chip-bg{fill:var(--bg); stroke:var(--line-bright); stroke-width:1;}
  .chip-text{font-family:'JetBrains Mono', monospace; font-size:10.5px; fill:var(--ink); text-anchor:middle;}

  .legend{
    display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-dim);
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:11px; height:11px; border-radius:50%; display:inline-block;}

  .result{
    margin-top:12px; padding:10px 14px; border-radius:8px; background:var(--panel);
    border:1px solid var(--panel-edge); font-family:'JetBrains Mono', monospace; font-size:12.5px;
    color:var(--ink-dim); min-height:20px;
  }
  .result b{color:var(--coral);}

  /* --- side panel --- */
  .panel{
    background:var(--panel); border:1px solid var(--panel-edge); border-radius:var(--radius);
    padding:16px 18px; height:100%;
  }
  .panel h2{font-size:16px; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .info-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .info-tab{
    flex:1; text-align:center; font-family:'JetBrains Mono', monospace; font-size:11px;
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    border-radius:6px; padding:7px 4px; cursor:pointer;
  }
  .info-tab.active{background:var(--line-bright); color:var(--ink);}
  .info-body{font-size:13.5px; line-height:1.62; color:var(--ink);}
  .info-body p{margin:0 0 10px;}
  pre.code{
    font-family:'JetBrains Mono', monospace; font-size:12px; line-height:1.55;
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; overflow-x:auto; color:#bcd6c8; white-space:pre;
  }
  .caveat{font-size:11.5px; color:var(--ink-dim); font-style:italic; margin-top:6px;}

  @media (max-width:900px){
    .side{flex-basis:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="eyebrow">Tavola tecnica &middot; teoria dei grafi</div>
      <h1>Cammini Minimi</h1>
    </div>
    <div class="sheet">FOGLIO 01 &middot; rev. random<br>grafo rigenerato ad ogni richiesta</div>
  </header>

  <div class="layout">
    <div class="stage">

      <div class="controls">
        <div class="algo-tabs" id="algoTabs"></div>
        <div class="btn-row">
          <button class="btn" id="btnNewGraph">&#8635; Nuovo grafo</button>
          <button class="btn primary" id="btnPlay">&#9654; Avvia</button>
          <button class="btn" id="btnStep">&#9197; Passo</button>
          <button class="btn" id="btnReset">&#8617; Riavvolgi</button>
          <div class="speed">
            <span>lento</span>
            <input type="range" id="speedRange" min="80" max="1200" value="500">
            <span>veloce</span>
          </div>
        </div>
      </div>

      <div class="svg-frame">
        <svg id="graphSvg" viewBox="0 0 760 460"></svg>
        <div class="legend">
          <span><i class="swatch" style="background:var(--paper); border:1px solid var(--line-bright);"></i>da esplorare</span>
          <span><i class="swatch" style="background:var(--amber);"></i>nodo corrente</span>
          <span><i class="swatch" style="background:var(--teal);"></i>visitato/definitivo</span>
          <span><i class="swatch" style="background:var(--coral);"></i>cammino finale</span>
        </div>
      </div>

      <div class="result" id="resultBox">Premi &#9654; Avvia per iniziare la simulazione.</div>
    </div>

    <div class="side">
      <div class="panel">
        <h2 id="panelTitle">Dijkstra</h2>
        <div class="info-tabs">
          <button class="info-tab active" data-tab="spiega">Spiega facile</button>
          <button class="info-tab" data-tab="storia">Storia</button>
          <button class="info-tab" data-tab="pseudo">Pseudocodice</button>
        </div>
        <div class="info-body" id="infoBody"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){

  // ---------- CONTENUTO DIDATTICO ----------
  const ALGOS = {
    dijkstra: {
      name: "Dijkstra",
      spiega: "<p>Parti dal nodo iniziale con distanza 0 e tutti gli altri a infinito. Ad ogni passo scegli, fra i nodi non ancora definitivi, quello con la distanza conosciuta più piccola: da quel momento la sua distanza è certa. Poi guardi i suoi vicini: se passando da lì il cammino è più corto di quello che conoscevi, aggiorni la stima. Ripeti finché non raggiungi la destinazione.</p><p>Funziona solo con pesi non negativi, ma è esatto: garantisce sempre il cammino di peso minimo.</p>",
      storia: "<p>Ideato da <b>Edsger W. Dijkstra</b> nel 1956, in circa 20 minuti, seduto a un caffè di Amsterdam mentre pensava a come collegare nel modo più breve 64 città olandesi &mdash; senza carta né penna. Lo pubblicò nel 1959 in un articolo di poche pagine.</p><p>Oggi è alla base di protocolli di instradamento reali come OSPF e IS-IS, usati ogni giorno nelle reti che studi a scuola.</p>",
      pseudo: "dist[start] = 0\ndist[tutti gli altri] = infinito\nQ = insieme di tutti i nodi\n\nfinché Q non è vuoto:\n    u = nodo in Q con dist minima\n    rimuovi u da Q\n    per ogni vicino v di u:\n        nuova = dist[u] + peso(u, v)\n        se nuova < dist[v]:\n            dist[v] = nuova\n            prev[v] = u"
    },
    bfs: {
      name: "BFS",
      spiega: "<p>La <i>Breadth-First Search</i> esplora il grafo per onde concentriche: prima tutti i vicini diretti del nodo di partenza, poi i vicini dei vicini, e così via. Usa una coda (il primo nodo che entra è il primo che esce).</p><p>Trova il cammino con il minor <b>numero di archi</b>, ignorando completamente i pesi: per BFS un arco da 1 e uno da 9 valgono lo stesso.</p>",
      storia: "<p>Le sue radici affondano nell'algoritmo di <b>Moore</b> (1959) per risolvere labirinti e nell'algoritmo di <b>Lee</b> (1961), sviluppato per instradare le piste sui circuiti stampati. Da lì è diventato una delle tecniche fondamentali su cui si costruisce quasi ogni algoritmo di grafi.</p>",
      pseudo: "coda = [start]\nvisitati = {start}\n\nfinché coda non è vuota:\n    u = coda.rimuovi_primo()\n    per ogni vicino v di u:\n        se v non è visitato:\n            visitati.aggiungi(v)\n            prev[v] = u\n            coda.aggiungi(v)"
    },
    dfs: {
      name: "DFS",
      spiega: "<p>La <i>Depth-First Search</i> si infila il più a fondo possibile lungo un ramo, prima di tornare indietro (backtracking) e provare un'altra strada. Usa una pila, o la ricorsione, invece di una coda.</p><p>Attenzione: <b>non garantisce il cammino più corto</b>. Trova solo <i>un</i> percorso possibile, spesso lungo e tortuoso: è utile per esplorare o verificare la connettività, non per l'ottimo.</p>",
      storia: "<p>La strategia è antichissima: nel 1882 il matematico francese <b>Charles Pierre Trémaux</b> la propose come metodo sistematico per risolvere i labirinti, segnando i corridoi già percorsi.</p><p>Formalizzata come algoritmo nel XX secolo, resta oggi alla base di tecniche come la ricerca delle componenti connesse e l'ordinamento topologico.</p>",
      pseudo: "DFS(u):\n    visitati.aggiungi(u)\n    se u è la destinazione: fine\n    per ogni vicino v di u:\n        se v non è visitato:\n            prev[v] = u\n            DFS(v)"
    },
    astar: {
      name: "A*",
      spiega: "<p>Come Dijkstra, ma più furbo: oltre alla distanza già percorsa (<b>g</b>), usa una stima di quanto manca alla destinazione (<b>h</b>, l'euristica &mdash; qui la distanza in linea d'aria). Ad ogni passo sceglie il nodo con <b>f = g + h</b> più piccola, quindi esplora prima le direzioni più promettenti invece di allargarsi a raggiera in ogni verso.</p>",
      storia: "<p>Proposto nel 1968 da <b>Peter Hart, Nils Nilsson e Bertram Raphael</b> allo Stanford Research Institute, durante lo sviluppo del robot mobile Shakey, uno dei primi robot capaci di ragionare sulle proprie azioni.</p><p>Da allora è diventato lo standard per il pathfinding in videogiochi, mappe stradali e robotica.</p>",
      pseudo: "g[start] = 0\naperti = {start}\n\nfinché aperti non è vuoto:\n    u = nodo in aperti con f = g+h minima\n    se u è la destinazione: fine\n    rimuovi u da aperti\n    per ogni vicino v di u:\n        tentativo = g[u] + peso(u, v)\n        se tentativo < g[v]:\n            g[v] = tentativo\n            prev[v] = u\n            aggiungi v ad aperti"
    }
  };
  const CAVEAT_ASTAR = "L'euristica qui è la distanza in linea d'aria fra i nodi, riscalata: è illustrativa e non garantita ottimale su questo grafo generato a caso (i pesi degli archi sono indipendenti dalle posizioni).";

  // ---------- STATO GLOBALE ----------
  let graph = null;
  let startNode = 0, endNode = 0;
  let currentAlgo = 'dijkstra';
  let steps = [];
  let stepIndex = 0;
  let playing = false;
  let playTimer = null;
  let checkFlashTimers = [];

  const svg = document.getElementById('graphSvg');
  const resultBox = document.getElementById('resultBox');
  const W = 760, H = 460;

  // ---------- GENERAZIONE GRAFO CASUALE ----------
  function dist2(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

  function generateGraph(){
    const n = 8 + Math.floor(Math.random()*4); // 8..11
    const margin = 55;
    const positions = [];
    for(let i=0;i<n;i++){
      let p, tries=0;
      do{
        p = {x: margin + Math.random()*(W-2*margin), y: margin + Math.random()*(H-2*margin)};
        tries++;
      } while (positions.some(q=>dist2(p,q)<78) && tries<300);
      positions.push(p);
    }
    const nodes = positions.map((p,i)=>({id:i, x:p.x, y:p.y, label:String.fromCharCode(65+i)}));

    const edgeSet = new Set();
    const edges = [];
    function key(a,b){ return a<b ? a+'_'+b : b+'_'+a; }
    function addEdge(a,b){
      if(a===b) return false;
      const k = key(a,b);
      if(edgeSet.has(k)) return false;
      edgeSet.add(k);
      edges.push({a,b,w: 1+Math.floor(Math.random()*9)});
      return true;
    }
    // albero di copertura casuale -> garantisce connessione
    const order = [...Array(n).keys()];
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    for(let i=1;i<order.length;i++){
      const a = order[i];
      const b = order[Math.floor(Math.random()*i)];
      addEdge(a,b);
    }
    // archi extra per rendere il grafo non banale (cicli)
    const extra = Math.max(2, Math.round(n/2));
    let attempts=0;
    while(attempts < extra*6 && edges.length < (n-1)+extra){
      addEdge(Math.floor(Math.random()*n), Math.floor(Math.random()*n));
      attempts++;
    }

    const adj = Array.from({length:n}, ()=>[]);
    edges.forEach(e=>{
      adj[e.a].push({to:e.b, w:e.w});
      adj[e.b].push({to:e.a, w:e.w});
    });
    return {n, nodes, edges, adj};
  }

  function bfsHops(g,a,b){
    const dist = Array(g.n).fill(-1);
    dist[a]=0;
    const q=[a];
    while(q.length){
      const u=q.shift();
      if(u===b) return dist[u];
      for(const {to} of g.adj[u]) if(dist[to]===-1){ dist[to]=dist[u]+1; q.push(to); }
    }
    return dist[b];
  }

  function pickEndpoints(g){
    let best=[0, g.n-1], bestScore=-1;
    for(let t=0;t<16;t++){
      const a = Math.floor(Math.random()*g.n);
      let b = Math.floor(Math.random()*g.n);
      if(b===a) b=(b+1)%g.n;
      const h = bfsHops(g,a,b);
      if(h>bestScore){ bestScore=h; best=[a,b]; }
    }
    return best;
  }

  // ---------- ALGORITMI -> SEQUENZA DI STEP ----------
  function reconstruct(prev, start, end){
    if(end!==start && prev[end]===-1) return null;
    const path=[end];
    let u=end;
    while(u!==start){ u=prev[u]; path.push(u); }
    path.reverse();
    return path;
  }

  function dijkstraSteps(g, start, end){
    const dist = Array(g.n).fill(Infinity);
    const visited = Array(g.n).fill(false);
    const prev = Array(g.n).fill(-1);
    dist[start]=0;
    const steps=[];
    for(let iter=0; iter<g.n; iter++){
      let u=-1, best=Infinity;
      for(let i=0;i<g.n;i++) if(!visited[i] && dist[i]<best){ best=dist[i]; u=i; }
      if(u===-1) break;
      visited[u]=true;
      steps.push({op:'current', node:u});
      for(const {to,w} of g.adj[u]){
        if(visited[to]) continue;
        steps.push({op:'edge-check', a:u, b:to});
        const nd = dist[u]+w;
        if(nd < dist[to]){
          dist[to]=nd; prev[to]=u;
          steps.push({op:'tree-edge', a:u, b:to});
        }
      }
      steps.push({op:'settle', node:u, label:'d='+(dist[u]===Infinity?'∞':dist[u])});
      if(u===end) break;
    }
    const path = reconstruct(prev, start, end);
    steps.push({op:'done', path, dist: dist[end]});
    return steps;
  }

  function bfsSteps(g, start, end){
    const visited = Array(g.n).fill(false);
    const prev = Array(g.n).fill(-1);
    const hop = Array(g.n).fill(Infinity);
    const steps=[];
    const queue=[start];
    visited[start]=true; hop[start]=0;
    steps.push({op:'frontier', node:start});
    while(queue.length){
      const u = queue.shift();
      steps.push({op:'current', node:u});
      for(const {to} of g.adj[u]){
        steps.push({op:'edge-check', a:u, b:to});
        if(!visited[to]){
          visited[to]=true; prev[to]=u; hop[to]=hop[u]+1;
          steps.push({op:'tree-edge', a:u, b:to});
          steps.push({op:'frontier', node:to});
          queue.push(to);
        }
      }
      steps.push({op:'settle', node:u, label:'passi='+hop[u]});
      if(u===end) break;
    }
    const path = reconstruct(prev, start, end);
    steps.push({op:'done', path, dist: hop[end]});
    return steps;
  }

  function dfsSteps(g, start, end){
    const visited = Array(g.n).fill(false);
    const prev = Array(g.n).fill(-1);
    const steps=[];
    let order=0, found=false;
    function visit(u){
      visited[u]=true; order++;
      steps.push({op:'current', node:u});
      steps.push({op:'settle', node:u, label:'#'+order});
      if(u===end){ found=true; return; }
      for(const {to} of g.adj[u]){
        if(found) return;
        steps.push({op:'edge-check', a:u, b:to});
        if(!visited[to]){
          prev[to]=u;
          steps.push({op:'tree-edge', a:u, b:to});
          visit(to);
          if(found) return;
        }
      }
    }
    visit(start);
    // calcola peso reale del cammino trovato (solo per il riepilogo)
    const path = reconstruct(prev, start, end);
    let totalW = 0;
    if(path){
      for(let i=0;i<path.length-1;i++){
        const edge = g.adj[path[i]].find(e=>e.to===path[i+1]);
        totalW += edge ? edge.w : 0;
      }
    }
    steps.push({op:'done', path, dist: totalW, note:'(non necessariamente minimo: DFS non lo garantisce)'});
    return steps;
  }

  function astarSteps(g, start, end){
    const target = g.nodes[end];
    const scale = 30;
    function h(i){ return dist2(g.nodes[i], target)/scale; }
    const gscore = Array(g.n).fill(Infinity);
    const visited = Array(g.n).fill(false);
    const prev = Array(g.n).fill(-1);
    gscore[start]=0;
    const steps=[];
    for(let iter=0; iter<g.n; iter++){
      let u=-1, best=Infinity;
      for(let i=0;i<g.n;i++) if(!visited[i] && gscore[i]<Infinity){
        const f = gscore[i]+h(i);
        if(f<best){ best=f; u=i; }
      }
      if(u===-1) break;
      visited[u]=true;
      steps.push({op:'current', node:u});
      for(const {to,w} of g.adj[u]){
        if(visited[to]) continue;
        steps.push({op:'edge-check', a:u, b:to});
        const ng = gscore[u]+w;
        if(ng < gscore[to]){
          gscore[to]=ng; prev[to]=u;
          steps.push({op:'tree-edge', a:u, b:to});
        }
      }
      steps.push({op:'settle', node:u, label:'g='+gscore[u]+' f='+(gscore[u]+h(u)).toFixed(1)});
      if(u===end) break;
    }
    const path = reconstruct(prev, start, end);
    steps.push({op:'done', path, dist: gscore[end]});
    return steps;
  }

  function computeSteps(){
    if(currentAlgo==='dijkstra') return dijkstraSteps(graph, startNode, endNode);
    if(currentAlgo==='bfs') return bfsSteps(graph, startNode, endNode);
    if(currentAlgo==='dfs') return dfsSteps(graph, startNode, endNode);
    return astarSteps(graph, startNode, endNode);
  }

  // ---------- RENDER SVG ----------
  let nodeEls = {}, edgeEls = {}, chipEls = {};

  function edgeKeyOf(a,b){ return a<b ? a+'_'+b : b+'_'+a; }

  function renderGraph(){
    svg.innerHTML = '';
    nodeEls = {}; edgeEls = {}; chipEls = {};

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    svg.appendChild(g);

    // griglia leggera di sfondo
    for(let x=0;x<=W;x+=38){
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',x); l.setAttribute('y1',0); l.setAttribute('x2',x); l.setAttribute('y2',H);
      l.setAttribute('class','grid-line');
      g.appendChild(l);
    }
    for(let y=0;y<=H;y+=38){
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',0); l.setAttribute('y1',y); l.setAttribute('x2',W); l.setAttribute('y2',y);
      l.setAttribute('class','grid-line');
      g.appendChild(l);
    }

    // archi
    graph.edges.forEach(e=>{
      const na = graph.nodes[e.a], nb = graph.nodes[e.b];
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',na.x); line.setAttribute('y1',na.y);
      line.setAttribute('x2',nb.x); line.setAttribute('y2',nb.y);
      line.setAttribute('class','edge');
      g.appendChild(line);
      edgeEls[edgeKeyOf(e.a,e.b)] = line;

      const mx = (na.x+nb.x)/2, my=(na.y+nb.y)/2;
      const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
      bg.setAttribute('x', mx-9); bg.setAttribute('y', my-9); bg.setAttribute('width',18); bg.setAttribute('height',16);
      bg.setAttribute('rx',3); bg.setAttribute('class','edge-w-bg');
      g.appendChild(bg);
      const wt = document.createElementNS('http://www.w3.org/2000/svg','text');
      wt.setAttribute('x',mx); wt.setAttribute('y',my+1); wt.setAttribute('class','edge-w'); wt.setAttribute('text-anchor','middle'); wt.setAttribute('dominant-baseline','central');
      wt.textContent = e.w;
      g.appendChild(wt);
    });

    // nodi
    graph.nodes.forEach(n=>{
      const grp = document.createElementNS('http://www.w3.org/2000/svg','g');
      const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circ.setAttribute('cx',n.x); circ.setAttribute('cy',n.y); circ.setAttribute('r',17);
      circ.setAttribute('class','node-circle');
      grp.appendChild(circ);
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x',n.x); label.setAttribute('y',n.y+1); label.setAttribute('class','node-label');
      label.textContent = n.label;
      grp.appendChild(label);

      if(n.id===startNode || n.id===endNode){
        const tag = document.createElementNS('http://www.w3.org/2000/svg','text');
        tag.setAttribute('x', n.x); tag.setAttribute('y', n.y-24);
        tag.setAttribute('class', 'tag ' + (n.id===startNode?'start':'end'));
        tag.textContent = n.id===startNode ? 'PARTENZA' : 'ARRIVO';
        grp.appendChild(tag);
      }

      svg.appendChild(grp);
      nodeEls[n.id] = circ;
    });
  }

  function clearChip(nodeId){
    if(chipEls[nodeId]){ chipEls[nodeId].remove(); delete chipEls[nodeId]; }
  }

  function showChip(nodeId, text){
    clearChip(nodeId);
    const n = graph.nodes[nodeId];
    const grp = document.createElementNS('http://www.w3.org/2000/svg','g');
    const w = 20 + text.length*5.6;
    const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x', n.x-w/2); bg.setAttribute('y', n.y+20); bg.setAttribute('width',w); bg.setAttribute('height',17);
    bg.setAttribute('rx',4); bg.setAttribute('class','chip-bg');
    grp.appendChild(bg);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', n.x); t.setAttribute('y', n.y+29); t.setAttribute('class','chip-text'); t.setAttribute('dominant-baseline','central');
    t.textContent = text;
    grp.appendChild(t);
    svg.appendChild(grp);
    chipEls[nodeId] = grp;
  }

  function resetVisualState(){
    Object.values(nodeEls).forEach(c=>c.setAttribute('class','node-circle'));
    Object.values(edgeEls).forEach(l=>l.setAttribute('class','edge'));
    Object.keys(chipEls).forEach(id=>clearChip(id));
    checkFlashTimers.forEach(t=>clearTimeout(t));
    checkFlashTimers = [];
    resultBox.innerHTML = 'Premi &#9654; Avvia per iniziare la simulazione.';
  }

  // ---------- APPLICAZIONE STEP ----------
  function applyStep(step){
    if(step.op==='current'){
      Object.values(nodeEls).forEach(c=>{ if(c.classList.contains('current')) c.classList.remove('current'); });
      nodeEls[step.node].classList.add('current');
    } else if(step.op==='frontier'){
      if(!nodeEls[step.node].classList.contains('settled')) nodeEls[step.node].classList.add('frontier');
    } else if(step.op==='edge-check'){
      const el = edgeEls[edgeKeyOf(step.a,step.b)];
      if(el){
        el.classList.add('checking');
        const t = setTimeout(()=>{ if(!el.classList.contains('tree') && !el.classList.contains('final')) el.classList.remove('checking'); }, 500);
        checkFlashTimers.push(t);
      }
    } else if(step.op==='tree-edge'){
      const el = edgeEls[edgeKeyOf(step.a,step.b)];
      if(el){ el.classList.remove('checking'); el.classList.add('tree'); }
    } else if(step.op==='settle'){
      const c = nodeEls[step.node];
      c.classList.remove('current','frontier');
      c.classList.add('settled');
      showChip(step.node, step.label);
    } else if(step.op==='done'){
      if(step.path){
        for(let i=0;i<step.path.length-1;i++){
          const el = edgeEls[edgeKeyOf(step.path[i], step.path[i+1])];
          if(el) el.classList.add('final');
        }
        step.path.forEach(id=>nodeEls[id].classList.add('final'));
        const letters = step.path.map(id=>graph.nodes[id].label).join(' → ');
        const distTxt = (currentAlgo==='bfs') ? (step.dist+' passi') : ('peso totale ' + step.dist);
        resultBox.innerHTML = 'Cammino trovato: <b>'+letters+'</b> &nbsp;(' + distTxt + ')' + (step.note ? '<br>'+step.note : '');
      } else {
        resultBox.innerHTML = 'Nessun cammino trovato (grafo non connesso — non dovrebbe succedere).';
      }
    }
  }

  // ---------- PLAYBACK ----------
  function stepForward(){
    if(stepIndex>=steps.length) { stopPlaying(); return; }
    applyStep(steps[stepIndex]);
    stepIndex++;
    if(stepIndex>=steps.length) stopPlaying();
  }

  function startPlaying(){
    if(playing) return;
    playing = true;
    document.getElementById('btnPlay').innerHTML = '&#10074;&#10074; Pausa';
    const speed = 1300 - Number(document.getElementById('speedRange').value);
    playTimer = setInterval(stepForward, speed);
  }
  function stopPlaying(){
    playing = false;
    document.getElementById('btnPlay').innerHTML = '&#9654; Avvia';
    clearInterval(playTimer);
  }

  document.getElementById('btnPlay').addEventListener('click', ()=>{
    if(playing) stopPlaying(); else {
      if(stepIndex>=steps.length){ resetVisualState(); stepIndex=0; }
      startPlaying();
    }
  });
  document.getElementById('btnStep').addEventListener('click', ()=>{
    stopPlaying();
    stepForward();
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    stopPlaying();
    stepIndex = 0;
    resetVisualState();
  });
  document.getElementById('btnNewGraph').addEventListener('click', ()=>{
    stopPlaying();
    newGraph();
  });
  document.getElementById('speedRange').addEventListener('input', ()=>{
    if(playing){ clearInterval(playTimer); const speed = 1300 - Number(document.getElementById('speedRange').value); playTimer = setInterval(stepForward, speed); }
  });

  // ---------- SETUP ALGORITMO / GRAFO ----------
  function newGraph(){
    graph = generateGraph();
    const ends = pickEndpoints(graph);
    startNode = ends[0]; endNode = ends[1];
    renderGraph();
    steps = computeSteps();
    stepIndex = 0;
    resetVisualState();
  }

  function switchAlgo(key){
    currentAlgo = key;
    document.querySelectorAll('.algo-tab').forEach(b=>b.classList.toggle('active', b.dataset.algo===key));
    document.getElementById('panelTitle').textContent = ALGOS[key].name;
    renderInfo();
    stopPlaying();
    steps = computeSteps();
    stepIndex = 0;
    resetVisualState();
  }

  // ---------- TAB ALGORITMI ----------
  const tabsWrap = document.getElementById('algoTabs');
  Object.keys(ALGOS).forEach(key=>{
    const b = document.createElement('button');
    b.className = 'algo-tab' + (key===currentAlgo ? ' active' : '');
    b.dataset.algo = key;
    b.textContent = ALGOS[key].name;
    b.addEventListener('click', ()=>switchAlgo(key));
    tabsWrap.appendChild(b);
  });

  // ---------- PANNELLO INFO ----------
  let infoTab = 'spiega';
  function renderInfo(){
    const a = ALGOS[currentAlgo];
    const body = document.getElementById('infoBody');
    if(infoTab==='spiega'){
      body.innerHTML = a.spiega + (currentAlgo==='astar' ? '<div class="caveat">'+CAVEAT_ASTAR+'</div>' : '');
    } else if(infoTab==='storia'){
      body.innerHTML = a.storia;
    } else {
      body.innerHTML = '<pre class="code">'+a.pseudo+'</pre>';
    }
  }
  document.querySelectorAll('.info-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.info-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      infoTab = btn.dataset.tab;
      renderInfo();
    });
  });

  // ---------- AVVIO ----------
  renderInfo();
  newGraph();

})();
</script>
</body>
</html>
